<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" width="880" height="376" role="img" aria-label="Terminal session: Muhammad Mustafa Noman, AI Engineer in Islamabad, Pakistan, open to AI and backend engineering roles. Builds LLM agent backends — the graph, the API in front of it, and the evals that keep it honest. Current work: multi-agent-frontdesk and research-agent.">
  <title>mustafa@arch — whoami</title>

  <defs>
