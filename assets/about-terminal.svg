    <text class="m" x="24" y="164">
      <tspan fill="#6EE7B7" font-weight="bold">mustafa@arch</tspan><tspan fill="#8FA89E"> </tspan><tspan fill="#7DD3FC">~</tspan><tspan fill="#4D7C6B"> $ </tspan><tspan fill="#E6EDF3">cat focus.txt</tspan>
    </text>
    <text class="m" x="24" y="187" fill="#A8BDB4">LLM agent backends. The graph, the API in front of it,</text>
    <text class="m" x="24" y="210" fill="#A8BDB4">and the evals that keep it honest.</text>

    <!-- now -->
