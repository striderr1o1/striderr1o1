    <rect width="880" height="38" fill="#0A1A13" />
    <circle cx="24" cy="19" r="6" fill="#E06C6C" />
    <circle cx="46" cy="19" r="6" fill="#D9A441" />
    <circle cx="68" cy="19" r="6" fill="#34D399" />
    <text class="t" x="440" y="24" text-anchor="middle" fill="#5E8577">mustafa@arch: ~</text>
    <rect x="0" y="37.5" width="880" height="1" fill="#14532D" />

    <!-- whoami -->
    <text class="m" x="24" y="72">
      <tspan fill="#6EE7B7" font-weight="bold">mustafa@arch</tspan><tspan fill="#8FA89E"> </tspan><tspan fill="#7DD3FC">~</tspan><tspan fill="#4D7C6B"> $ </tspan><tspan fill="#E6EDF3">whoami</tspan>
    </text>
    <text class="m" x="24" y="95">
      <tspan fill="#E6EDF3" font-weight="bold">Muhammad Mustafa Noman</tspan><tspan fill="#6EE7B7"> — AI Engineer</tspan>
    </text>
    <text class="m" x="24" y="118" fill="#8FA89E">Islamabad, PK · open to AI / backend engineering roles</text>

