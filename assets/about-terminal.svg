      <tspan fill="#6EE7B7" font-weight="bold">mustafa@arch</tspan><tspan fill="#8FA89E"> </tspan><tspan fill="#7DD3FC">~</tspan><tspan fill="#4D7C6B"> $ </tspan><tspan fill="#E6EDF3">ls -1 ~/now</tspan>
    </text>
    <text class="m" x="24" y="279" xml:space="preserve"><tspan fill="#6EE7B7">multi-agent-frontdesk/</tspan><tspan fill="#4D7C6B">    # multi-tenant agents, per-tenant RLS, 60-scenario evals</tspan></text>
    <text class="m" x="24" y="302" xml:space="preserve"><tspan fill="#6EE7B7">research-agent/</tspan><tspan fill="#4D7C6B">           # planner → retriever, web search, summariser</tspan></text>

    <!-- cursor -->
    <text class="m" x="24" y="348">
      <tspan fill="#6EE7B7" font-weight="bold">mustafa@arch</tspan><tspan fill="#8FA89E"> </tspan><tspan fill="#7DD3FC">~</tspan><tspan fill="#4D7C6B"> $ </tspan><tspan fill="#6EE7B7">█<animate attributeName="fill-opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.06s" repeatCount="indefinite" /></tspan>
